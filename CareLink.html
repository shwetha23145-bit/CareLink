<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareLink</title>
<style>
:root{
  --blue:#1261A0;--green:#36A269;--bg:#F3F8FC;--red:#D8362A;--ink:#122436;--muted:#5B7285;
  --card:#fff;--pastel-b:#E4F0FA;--pastel-g:#E5F6EC;--pastel-p:#F0E9FB;--pastel-y:#FFF6DE;--pastel-pk:#FCE9F1;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1720;--card:#152230;--ink:#eaf2f8;--muted:#93a7b8;}}
:root[data-theme="dark"]{--bg:#0e1720;--card:#152230;--ink:#eaf2f8;--muted:#93a7b8;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header.top{position:sticky;top:0;padding:14px 16px calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--blue),#0e4f80);color:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.brandname{font-weight:800;font-size:19px;letter-spacing:.3px}
.tagline{font-size:11px;opacity:.85}
.topbar-row{display:flex;justify-content:space-between;align-items:center}
.icon-btn{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer}
main{flex:1;padding:14px 14px 90px;overflow-x:hidden}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,50,80,.06);margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
p.muted,.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #cfe0ec;font-size:15px;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.req::after{content:" *";color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn-primary{background:var(--blue);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--blue);color:var(--blue)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feature{border-radius:16px;padding:14px;cursor:pointer;border:none;text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:6px}
.feature .ic{font-size:24px}
.feature .t{font-weight:800;font-size:14px;color:var(--ink)}
.feature .d{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill-normal{background:#E5F6EC;color:#1c7a45}
.pill-attention{background:#FFF3CD;color:#8a6d00}
.pill-urgent{background:#FBE1DE;color:#b1291d}
.pill-blue{background:var(--pastel-b);color:var(--blue)}
nav.bottom{position:sticky;bottom:0;background:var(--card);border-top:1px solid #e1ecf3;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom button{flex:1;background:none;border:none;padding:8px 2px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit}
nav.bottom button.active{color:var(--blue);font-weight:800}
nav.bottom .ic{display:block;font-size:19px;margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center}
.vital{background:var(--pastel-b);border-radius:12px;padding:10px;text-align:center}
.vital .v{font-size:18px;font-weight:800}
.vital .l{font-size:10.5px;color:var(--muted)}
.patient-card{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:var(--pastel-b);margin-bottom:8px;cursor:pointer}
.audit-item{font-size:12px;color:var(--muted);border-left:2px solid #cfe0ec;padding:4px 0 4px 10px;margin-bottom:2px}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.4}
.msg.user{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--pastel-g);border-bottom-left-radius:4px}
.disclaimer{font-size:11px;color:var(--muted);background:#FFF6DE;border-radius:10px;padding:8px 10px;margin-top:8px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#122436;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .ic{font-size:36px;margin-bottom:8px}
.badge-net{font-size:11px;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:20px}
a.linklike{color:var(--blue);font-size:13px;text-decoration:none;font-weight:600}
.chart-bar{background:var(--pastel-b);border-radius:6px 6px 0 0;width:20px}
.sev{display:flex;gap:6px;flex-wrap:wrap}
.sev button{border:1px solid #cfe0ec;background:var(--card);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
.sev button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.qr{width:96px;height:96px;margin:0 auto;background:
  repeating-linear-gradient(90deg,#122436 0 6px,#fff 6px 12px),
  repeating-linear-gradient(0deg,#122436 0 6px,transparent 6px 12px);
  border:6px solid #122436;border-radius:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CARELINK — local functional demo ============
   Persistence: browser localStorage (stands in for MongoDB in this
   sandboxed demo — see the note on the About screen). AI features
   use an on-device rule engine (no cloud key configured) and are
   clearly labeled as decision-support, not diagnosis. */

const DB_KEY='carelink_db_v1';
function loadDB(){
  let d=localStorage.getItem(DB_KEY);
  if(d) return JSON.parse(d);
  const fresh={users:[],patients:[],assessments:[],reviews:[],notifications:[],audit:[],chats:{},seq:1000};
  localStorage.setItem(DB_KEY,JSON.stringify(fresh));
  return fresh;
}
let DB=loadDB();
function save(){ localStorage.setItem(DB_KEY,JSON.stringify(DB)); }
function uid(p){ DB.seq++; return p+DB.seq; }
function audit(action,detail){
  DB.audit.unshift({id:uid('AU'),user:state.user?state.user.name:'system',role:state.user?state.user.role:'-',action,detail,ts:new Date().toISOString()});
  save();
}
function notify(title,body){
  DB.notifications.unshift({id:uid('N'),title,body,read:false,ts:new Date().toISOString()});
  save();
}

const state={ user:null, view:'splash', lang:'en', patientId:null, toast:null, tab:'home' };

const T={
  en:{welcome:'Welcome, Health Worker',dash_sub:'AI-assisted patient assessment, summaries, records and clinical review support.',
    newpatient:'New Patient',np_d:'Register and assess a patient',records:'Patient Records',rec_d:'View saved patient assessments',
    chart:'AI Chart Board',chart_d:'Visual patient insights and attention trends',assess:'Assessment',assess_d:'Check patient vitals and symptoms',
    summary:'AI Summary',sum_d:'Get a quick patient summary',review:'Clinical Review',rev_d:'Flag cases needing professional review',
    lang:'Local Languages',lang_d:'English, Kannada, Hindi',voice:'Voice Mode',voice_d:'Speak and listen to assistance',
    emergency:'Emergency Call',call108:'Call 108 for ambulance',footer1:'Better Care, Healthier Communities.',
    footer2:'Health support that connects people, information and care.',safety:'AI assistance is for decision support only and does not replace a qualified medical professional.'},
  kn:{welcome:'ಸ್ವಾಗತ, ಆರೋಗ್ಯ ಕಾರ್ಯಕರ್ತರೇ',dash_sub:'AI-ಸಹಾಯಿತ ರೋಗಿ ಮೌಲ್ಯಮಾಪನ, ಸಾರಾಂಶ, ದಾಖಲೆಗಳು ಮತ್ತು ಕ್ಲಿನಿಕಲ್ ಪರಿಶೀಲನೆ ಬೆಂಬಲ.',
    newpatient:'ಹೊಸ ರೋಗಿ',np_d:'ರೋಗಿಯನ್ನು ನೋಂದಾಯಿಸಿ',records:'ರೋಗಿ ದಾಖಲೆಗಳು',rec_d:'ಉಳಿಸಿದ ಮೌಲ್ಯಮಾಪನಗಳು',
    chart:'AI ಚಾರ್ಟ್ ಬೋರ್ಡ್',chart_d:'ದೃಶ್ಯ ರೋಗಿ ಒಳನೋಟಗಳು',assess:'ಮೌಲ್ಯಮಾಪನ',assess_d:'ರೋಗಲಕ್ಷಣಗಳನ್ನು ಪರಿಶೀಲಿಸಿ',
    summary:'AI ಸಾರಾಂಶ',sum_d:'ತ್ವರಿತ ರೋಗಿ ಸಾರಾಂಶ',review:'ಕ್ಲಿನಿಕಲ್ ಪರಿಶೀಲನೆ',rev_d:'ವೃತ್ತಿಪರ ಪರಿಶೀಲನೆ ಅಗತ್ಯವಿರುವ ಪ್ರಕರಣಗಳು',
    lang:'ಸ್ಥಳೀಯ ಭಾಷೆಗಳು',lang_d:'ಇಂಗ್ಲಿಷ್, ಕನ್ನಡ, ಹಿಂದಿ',voice:'ಧ್ವನಿ ಮೋಡ್',voice_d:'ಮಾತನಾಡಿ ಮತ್ತು ಕೇಳಿ',
    emergency:'ತುರ್ತು ಕರೆ',call108:'ಆಂಬ್ಯುಲೆನ್ಸ್‌ಗಾಗಿ 108 ಗೆ ಕರೆ ಮಾಡಿ',footer1:'ಉತ್ತಮ ಆರೈಕೆ, ಆರೋಗ್ಯಕರ ಸಮುದಾಯಗಳು.',
    footer2:'ಜನರು, ಮಾಹಿತಿ ಮತ್ತು ಆರೈಕೆಯನ್ನು ಸಂಪರ್ಕಿಸುವ ಆರೋಗ್ಯ ಬೆಂಬಲ.',safety:'AI ನೆರವು ನಿರ್ಧಾರ-ಬೆಂಬಲಕ್ಕೆ ಮಾತ್ರ; ವೈದ್ಯರ ಬದಲಿಯಲ್ಲ.'},
  hi:{welcome:'स्वागत है, स्वास्थ्य कार्यकर्ता',dash_sub:'AI-सहायता प्राप्त रोगी मूल्यांकन, सारांश, रिकॉर्ड और क्लिनिकल समीक्षा सहायता।',
    newpatient:'नया रोगी',np_d:'रोगी को पंजीकृत करें',records:'रोगी रिकॉर्ड',rec_d:'सहेजे गए मूल्यांकन देखें',
    chart:'AI चार्ट बोर्ड',chart_d:'रोगी की जानकारी और रुझान',assess:'मूल्यांकन',assess_d:'लक्षणों की जाँच करें',
    summary:'AI सारांश',sum_d:'त्वरित रोगी सारांश',review:'क्लिनिकल समीक्षा',rev_d:'पेशेवर समीक्षा की आवश्यकता वाले मामले',
    lang:'स्थानीय भाषाएँ',lang_d:'अंग्रेज़ी, कन्नड़, हिंदी',voice:'वॉयस मोड',voice_d:'बोलें और सुनें',
    emergency:'आपातकालीन कॉल',call108:'एम्बुलेंस के लिए 108 डायल करें',footer1:'बेहतर देखभाल, स्वस्थ समुदाय।',
    footer2:'लोगों, जानकारी और देखभाल को जोड़ने वाला स्वास्थ्य समर्थन।',safety:'AI सहायता केवल निर्णय-समर्थन हेतु है, योग्य चिकित्सक का विकल्प नहीं।'}
};
function t(k){ return (T[state.lang]&&T[state.lang][k]) || T.en[k] || k; }

const VITAL_RANGES={
  temperature:{min:35,max:42,unit:'°C'},heartRate:{min:30,max:220,unit:'bpm'},spo2:{min:50,max:100,unit:'%'},
  respRate:{min:5,max:60,unit:'/min'},glucose:{min:20,max:600,unit:'mg/dL'},bpSys:{min:60,max:260,unit:'mmHg sys'},
  bpDia:{min:30,max:160,unit:'mmHg dia'},weight:{min:1,max:300,unit:'kg'},height:{min:20,max:250,unit:'cm'},age:{min:0,max:120,unit:'yrs'}
};

function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleString(); }

/* ---------- rule-based AI (local decision support, no cloud key) ---------- */
function ruleAnalyzeAssessment(a){
  const flags=[]; let risk='normal';
  const hr=+a.heartRate, sp=+a.spo2, temp=+a.temperature, sysbp=+a.bpSys;
  if(sp && sp<92){ flags.push('SpO2 reading is low ('+sp+'%). Low oxygen saturation may need urgent evaluation.'); risk='urgent'; }
  else if(sp && sp<95){ flags.push('SpO2 is on the lower side ('+sp+'%). Consider professional evaluation if it persists.'); if(risk!=='urgent') risk='attention'; }
  if(temp && temp>=39.5){ flags.push('High fever recorded ('+temp+'°C). Consider urgent evaluation, especially in children or the elderly.'); risk='urgent'; }
  else if(temp && temp>=38){ flags.push('Fever recorded ('+temp+'°C). Monitor and consider professional evaluation if it persists beyond 2-3 days.'); if(risk!=='urgent') risk='attention'; }
  if(hr && (hr>130||hr<45)){ flags.push('Heart rate is outside the usual range ('+hr+' bpm). This may be associated with several conditions and professional evaluation is advised.'); if(risk!=='urgent') risk='attention'; }
  if(sysbp && (sysbp>=180||sysbp<85)){ flags.push('Blood pressure reading is notably abnormal. Urgent professional evaluation is advised.'); risk='urgent'; }
  const sym=(a.symptoms||'').toLowerCase();
  ['chest pain','breathless','difficulty breathing','unconscious','severe bleeding','seizure'].forEach(k=>{
    if(sym.includes(k)){ flags.push('Reported symptom "'+k+'" may be associated with a medical emergency. Seek urgent care if severe.'); risk='urgent'; }
  });
  if(!flags.length) flags.push('No high-risk indicators were detected from the entered information. This does not rule out illness — use clinical judgement.');
  return {risk,flags};
}
function riskLabel(r){ return r==='urgent'?'Urgent':r==='attention'?'Attention':'Normal'; }
function riskPillClass(r){ return r==='urgent'?'pill-urgent':r==='attention'?'pill-attention':'pill-normal'; }

/* ---------- rendering ---------- */
const app=document.getElementById('app');
function render(){ app.innerHTML=''; app.appendChild(views[state.view]()); if(state.toast){ const tel=document.createElement('div'); tel.className='toast'; tel.textContent=state.toast; app.appendChild(tel); setTimeout(()=>{state.toast=null; if(document.body.contains(tel)) tel.remove();},2200);} }
function go(view,extra){ Object.assign(state,extra||{}); state.view=view; render(); window.scrollTo(0,0); }
function toast(msg){ state.toast=msg; render(); }
function el(tag,attrs,children){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ if(k==='html') e.innerHTML=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function shell(contentEl, opts){
  opts=opts||{};
  const wrap=document.createDocumentFragment ? document.createElement('div') : null;
  const header=el('header',{class:'top'},[
    el('div',{class:'topbar-row'},[
      el('div',{class:'brand'},[ el('div',{class:'logo'},['✚']), el('div',{},[ el('div',{class:'brandname'},['CareLink']), el('div',{class:'tagline'},['Health Support for a Brighter Tomorrow']) ]) ]),
      state.user? el('div',{style:'display:flex;gap:6px;align-items:center'},[
        el('span',{class:'badge-net'},['🟢 Local']),
        el('button',{class:'icon-btn',onclick:()=>go('notifications')},['🔔'+(DB.notifications.filter(n=>!n.read).length? ' '+DB.notifications.filter(n=>!n.read).length:'')]),
        el('button',{class:'icon-btn',onclick:()=>go('profile')},['👤'])
      ]) : el('span',{class:'badge-net'},['🟢 Local demo'])
    ])
  ]);
  const main=el('main',{},[contentEl]);
  const container=el('div',{},[header,main]);
  if(state.user){
    const tabs=[['home','🏠','Home'],['patients','🗂️','Patients'],['ai','💬','AI'],['reviews','🚩','Reviews'],['profile','👤','Profile']];
    const nav=el('nav',{class:'bottom'},tabs.map(([id,ic,label])=>el('button',{class:state.tab===id?'active':'', onclick:()=>{ state.tab=id; if(id==='home')go('dashboard'); else if(id==='patients')go('records'); else if(id==='ai')go('chat'); else if(id==='reviews')go('reviewList'); else go('profile'); }},[el('span',{class:'ic'},[ic]),label])));
    container.appendChild(nav);
  }
  return container;
}

/* ---------- VIEWS ---------- */
const views={};

views.splash=function(){
  const c=el('div',{style:'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#1261A0,#0b3a5c);color:#fff;text-align:center;padding:30px'},[
    el('div',{style:'font-size:56px;margin-bottom:10px'},['✚🌿']),
    el('div',{style:'font-size:30px;font-weight:800'},['CareLink']),
    el('div',{style:'opacity:.9;margin-top:6px'},['Health Support for a Brighter Tomorrow']),
    el('button',{class:'btn btn-green',style:'margin-top:34px;max-width:220px',onclick:()=>go('welcome')},['Continue'])
  ]);
  return c;
};

views.welcome=function(){
  const c=el('div',{style:'padding:24px'},[
    el('div',{class:'card',style:'text-align:center'},[
      el('div',{style:'font-size:40px'},['🏡🌳✚']),
      el('h2',{},['Welcome to CareLink']),
      el('p',{class:'muted'},['AI-assisted healthcare support for health workers in rural and semi-urban communities. Register patients, track vitals, and get decision-support in English, Kannada or Hindi.']),
      el('button',{class:'btn btn-primary',style:'margin-top:14px',onclick:()=>go('login')},['Health Worker Login']),
      el('button',{class:'btn btn-outline',style:'margin-top:10px',onclick:()=>go('register')},['Register']),
      el('p',{class:'disclaimer'},[t('safety')])
    ])
  ]);
  return c;
};

views.register=function(){
  const c=el('div',{style:'padding:20px'});
  const card=el('div',{class:'card'},[
    el('h2',{},['Create account']),
    fld('reg_name','Full name',true),
    fld('reg_mobile','Mobile number',true,'tel'),
    fld('reg_email','Email',false,'email'),
    labelSelect('reg_role','Role',['health_worker:Health Worker','doctor:Doctor / Clinical Reviewer','admin:Admin']),
    fld('reg_location','Location / community',false),
    fld('reg_pass','Password',true,'password'),
    fld('reg_pass2','Confirm password',true,'password'),
    el('button',{class:'btn btn-primary',style:'margin-top:14px',onclick:doRegister},['Register']),
    el('div',{style:'text-align:center;margin-top:10px'},[ el('a',{class:'linklike',onclick:()=>go('login')},['Already have an account? Login']) ])
  ]);
  c.appendChild(card);
  return c;
};
function fld(id,label,req,type){
  return el('div',{},[ el('label',{class:req?'req':''},[label]), el('input',{id,type:type||'text'}) ]);
}
function labelSelect(id,label,opts){
  const sel=el('select',{id});
  opts.forEach(o=>{ const [v,l]=o.split(':'); sel.appendChild(el('option',{value:v},[l])); });
  return el('div',{},[ el('label',{},[label]), sel ]);
}
function doRegister(){
  const name=document.getElementById('reg_name').value.trim();
  const mobile=document.getElementById('reg_mobile').value.trim();
  const email=document.getElementById('reg_email').value.trim();
  const role=document.getElementById('reg_role').value;
  const location=document.getElementById('reg_location').value.trim();
  const pass=document.getElementById('reg_pass').value;
  const pass2=document.getElementById('reg_pass2').value;
  if(!name||!mobile||!pass){ toast('Please fill all required fields.'); return; }
  if(pass.length<4){ toast('Password must be at least 4 characters.'); return; }
  if(pass!==pass2){ toast('Passwords do not match.'); return; }
  if(DB.users.some(u=>u.mobile===mobile)){ toast('An account with this mobile number already exists.'); return; }
  const user={id:uid('U'),name,mobile,email,role,location,pass};
  DB.users.push(user); save();
  audit('register',name+' registered as '+role);
  toast('Account created. Please log in.');
  go('login');
}

views.login=function(){
  const c=el('div',{style:'padding:20px'});
  const card=el('div',{class:'card'},[
    el('h2',{},['Health Worker Login']),
    fld('login_mobile','Mobile number or email',true),

function checkRange(key,val){
  if(val==='') return true;
  const r=VITAL_RANGES[key]; if(!r) return true;

function saveAssessment(p){

views.chartBoard=function(){
  const wrap=el('div',{style:'padding:16px'});
  wrap.appendChild(el('h2',{},[t('chart')]));
  wrap.appendChild(el('p',{class:'muted'},[t('chart_d')]));
  if(!DB.patients.length){ wrap.appendChild(el('div',{class:'empty'},['No sufficient data for trend analysis.'])); return shell(wrap); }
  const sel=el('select',{style:'margin-bottom:12px'},DB.patients.map(p=>el('option',{value:p.id},[p.name])));
  wrap.appendChild(sel);
  const box=el('div',{class:'card'});
  function draw(){
    box.innerHTML='';
    const p=DB.patients.find(x=>x.id===sel.value)||DB.patients[0];
    const as=DB.assessments.filter(a=>a.patientId===p.id).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    if(!as.length){ box.appendChild(el('div',{class:'empty'},['No sufficient data for trend analysis.'])); return; }
    box.appendChild(el('h3',{},['Heart rate trend']));
    const maxHr=Math.max(...as.map(a=>a.heartRate||0),100);
    const barsWrap=el('div',{style:'display:flex;align-items:flex-end;gap:6px;height:110px;overflow-x:auto'});
    as.forEach(a=>{ const h=a.heartRate? Math.max(6,(a.heartRate/maxHr)*100):4; barsWrap.appendChild(el('div',{class:'chart-bar',style:'height:'+h+'px'})); });
    box.appendChild(barsWrap);
    box.appendChild(el('h3',{style:'margin-top:14px'},['Attention Trends']));
    const last=as[as.length-1];
    const prev=as.length>1?as[as.length-2]:null;
    const insights=[];
    if(prev && last.heartRate && prev.heartRate && Math.abs(last.heartRate-prev.heartRate)>=15) insights.push('Heart rate has changed noticeably compared with the previous record.');
    if(last.spo2 && last.spo2<95) insights.push('SpO2 readings should be reviewed by a qualified professional if persistently low.');
    if(!insights.length) insights.push('No notable attention trends detected from recorded data.');
    insights.forEach(i=>box.appendChild(el('p',{style:'font-size:13.5px'},['• '+i])));
  }
  sel.addEventListener('change',draw); draw();
  wrap.appendChild(box);
  return shell(wrap);
};

views.chat=function(){
  const uidKey=state.user.id;
  DB.chats[uidKey]=DB.chats[uidKey]||[];
  const wrap=el('div',{style:'padding:16px;display:flex;flex-direction:column;height:calc(100vh - 190px)'});
  wrap.appendChild(el('div',{class:'row'},[el('h2',{},['CareLink AI Assistant']),el('button',{class:'btn btn-outline btn-sm',onclick:()=>{DB.chats[uidKey]=[];save();go('chat');}},['Clear'])]));
  const log=el('div',{style:'flex:1;overflow-y:auto;padding:6px 0'});
  DB.chats[uidKey].forEach(m=> log.appendChild(el('div',{class:'msg '+(m.role==='user'?'user':'ai')},[m.text])) );
  wrap.appendChild(log);
  const inputRow=el('div',{style:'display:flex;gap:8px;margin-top:8px'});
  const inp=el('input',{placeholder:'Ask about symptoms, vitals, guidance...'});
  const send=()=>{
    const text=inp.value.trim(); if(!text) return;
    DB.chats[uidKey].push({role:'user',text}); 
    const reply=chatReply(text);
    DB.chats[uidKey].push({role:'ai',text:reply});
    save(); inp.value=''; go('chat');
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  inputRow.appendChild(inp);
  inputRow.appendChild(el('button',{class:'btn btn-primary btn-sm',onclick:send},['Send']));
  inputRow.appendChild(el('button',{class:'btn btn-outline btn-sm',onclick:()=>go('voice')},['🎙️']));
  wrap.appendChild(inputRow);
  wrap.appendChild(el('p',{class:'disclaimer'},['CareLink AI provides general decision-support information only — not a diagnosis. No cloud AI key is configured in this demo, so responses use an on-device rule engine.']));
  setTimeout(()=>{log.scrollTop=log.scrollHeight;},0);
  return shell(wrap);
};
function chatReply(text){
  const l=text.toLowerCase();
  if(l.includes('chest pain')||l.includes('unconscious')||l.includes('severe bleeding')||l.includes('not breathing')) return 'This may describe a medical emergency. Please use the Emergency Call (108) feature and seek immediate professional care. I can\'t provide a diagnosis.';
  if(l.includes('fever')) return 'Fever with cough can have several causes. Consider: duration, temperature trend, breathing difficulty, and hydration. Suggested next steps: check temperature regularly, monitor for breathing difficulty, and consider professional evaluation if fever exceeds 38.5°C or persists beyond 2-3 days. This is general information, not a diagnosis.';
  if(l.includes('bp')||l.includes('blood pressure')) return 'For blood pressure concerns, note systolic/diastolic trend over time and any symptoms like headache or dizziness. Very high or very low readings should be professionally evaluated. I can\'t interpret this as a diagnosis.';
  return 'Thanks for sharing that. Based on general health information: monitor symptoms, record vitals if possible, and consider professional evaluation if symptoms are severe, worsening, or the patient has risk factors. I\'m a decision-support assistant, not a substitute for a qualified healthcare professional.';
}

views.voice=function(){
  const wrap=el('div',{style:'padding:16px;text-align:center'});
  wrap.appendChild(el('h2',{},[t('voice')]));
  wrap.appendChild(el('p',{class:'muted'},[t('voice_d')]));
  const status=el('p',{},['']);
  const mic=el('button',{style:'font-size:60px;background:none;border:none;cursor:pointer'},['🎙️']);
  wrap.appendChild(mic); wrap.appendChild(status);
  const out=el('div',{style:'margin-top:18px;text-align:left'});
  wrap.appendChild(out);
  mic.addEventListener('click',()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ status.textContent='Speech recognition isn\'t available on this device/browser. Use text chat instead.'; return; }
    const rec=new SR(); rec.lang= state.lang==='hi'?'hi-IN':state.lang==='kn'?'kn-IN':'en-IN';
    status.textContent='Listening...';
    rec.onresult=(e)=>{
      const text=e.results[0][0].transcript;
      status.textContent='Processing...';
      out.appendChild(el('div',{class:'msg user'},[text]));
      const reply=chatReply(text);
      out.appendChild(el('div',{class:'msg ai'},[reply]));
      status.textContent='Speaking...';
      try{ const u=new SpeechSynthesisUtterance(reply); speechSynthesis.speak(u); u.onend=()=>status.textContent=''; }catch(e){ status.textContent=''; }
    };
    rec.onerror=()=>{ status.textContent='Microphone permission required or recognition failed. You can use text chat instead.'; };
    rec.start();
  });
  return shell(wrap);
};
